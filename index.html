<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f6fbfe">
  <title>Positive Emotion Practice</title>

  <!-- PWA manifest + iOS home-screen support -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Emotion Practice">
  <link rel="apple-touch-icon" href="icon-180.png">

  <style>
    :root {
      --deep-blue: #0b3a5e;
      --mid-blue:  #1f6f9f;
      --sky:       #e6f4fb;
      --pale:      #f6fbfe;
      --white:     #ffffff;
      --orange:    #f47b20;
      --orange-soft:#fdead9;
      --ink:       #123049;
      --ink-soft:  rgba(18, 48, 73, 0.66);
      --ink-faint: rgba(18, 48, 73, 0.42);
      --hairline:  rgba(11, 58, 94, 0.10);
      --radius:    26px;
      --tap:       52px; /* comfortable thumb target */
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
    }

    body {
      font-family: "Avenir Next", Avenir, "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 84% 6%, rgba(244,123,32,.10), transparent 30%),
        radial-gradient(circle at 8% 96%, rgba(31,111,159,.12), transparent 32%),
        linear-gradient(160deg, var(--white) 0%, var(--pale) 55%, var(--sky) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding:
        calc(env(safe-area-inset-top) + 20px)
        clamp(16px, 5vw, 26px)
        calc(env(safe-area-inset-bottom) + 18px);
    }

    /* ---- header ---- */
    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: var(--mid-blue);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }
    .kicker::before {
      content: "";
      width: 8px; height: 8px;
      border-radius: 99px;
      background: var(--orange);
      box-shadow: 0 0 0 5px rgba(244,123,32,.12);
      flex: none;
    }
    .date-line {
      margin: 10px 0 0;
      color: var(--ink-faint);
      font-size: 13px;
      letter-spacing: .01em;
    }

    /* ---- the card: the emotion is the hero ---- */
    .card {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: 18px 0;
      padding: clamp(24px, 6vw, 40px) clamp(18px, 5vw, 30px);
      border-radius: var(--radius);
      background:
        radial-gradient(circle at 92% 8%, rgba(244,123,32,.10), transparent 30%),
        linear-gradient(150deg, var(--white), #f2f9fe);
      border: 1px solid var(--hairline);
      box-shadow: 0 20px 54px rgba(11,58,94,.12);
      min-height: 0;
    }
    .card-label {
      color: var(--orange);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .18em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }
    .word {
      display: block;
      width: 100%;
      color: var(--deep-blue);
      font-weight: 700;
      line-height: 1.02;
      letter-spacing: -.02em;
      white-space: nowrap;      /* auto-fit keeps it on one line */
      font-size: 64px;          /* JS shrinks this to fit */
      transition: opacity .16s ease, transform .16s ease;
    }
    .word.changing { opacity: 0; transform: translateY(6px); }

    .definition {
      max-width: 30ch;
      margin: 16px auto 0;
      color: var(--ink-soft);
      font-size: clamp(15px, 4vw, 17px);
      line-height: 1.5;
    }

    /* the signature reframe — quiet but always present */
    .prompt {
      margin: 22px auto 0;
      max-width: 26ch;
      color: var(--deep-blue);
      font-size: clamp(17px, 4.6vw, 20px);
      line-height: 1.35;
      font-weight: 600;
    }

    /* ---- reflection ---- */
    .reflect {
      margin-top: 18px;
    }
    .reflect summary {
      list-style: none;
      cursor: pointer;
      color: var(--mid-blue);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .01em;
      padding: 8px 2px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }
    .reflect summary::-webkit-details-marker { display: none; }
    .reflect summary::before {
      content: "＋";
      font-weight: 700;
      color: var(--orange);
    }
    .reflect[open] summary::before { content: "－"; }
    .reflect textarea {
      width: 100%;
      margin-top: 8px;
      min-height: 92px;
      padding: 14px 15px;
      border-radius: 16px;
      border: 1px solid var(--hairline);
      background: var(--white);
      color: var(--ink);
      font: inherit;
      font-size: 16px; /* >=16px stops iOS zoom-on-focus */
      line-height: 1.5;
      resize: vertical;
    }
    .reflect textarea:focus {
      outline: none;
      border-color: var(--mid-blue);
      box-shadow: 0 0 0 3px rgba(31,111,159,.14);
    }
    .reflect .note-status {
      margin-top: 6px;
      font-size: 12px;
      color: var(--ink-faint);
      min-height: 15px;
    }

    /* ---- actions ---- */
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }
    button {
      appearance: none;
      border: 0;
      border-radius: 999px;
      min-height: var(--tap);
      padding: 14px 20px;
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .01em;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary {
      color: var(--white);
      background: linear-gradient(135deg, var(--deep-blue), var(--mid-blue));
      box-shadow: 0 12px 26px rgba(11,58,94,.22);
    }
    .btn-primary:active { transform: translateY(1px); }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .btn-secondary {
      flex: 1 1 0;
      color: var(--deep-blue);
      background: var(--white);
      border: 1px solid var(--hairline);
    }
    .btn-secondary:active { background: #f0f7fc; }

    .status {
      min-height: 18px;
      margin-top: 12px;
      text-align: center;
      color: var(--ink-faint);
      font-size: 13px;
    }

    /* ---- palette footer ---- */
    .palette {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid var(--hairline);
    }
    .palette summary {
      list-style: none;
      cursor: pointer;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      padding: 4px 2px;
    }
    .palette summary::-webkit-details-marker { display: none; }
    .palette .p-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }
    .palette .p-count {
      font-size: 13px;
      color: var(--mid-blue);
      font-weight: 700;
    }
    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 12px;
    }
    .chip {
      font-size: 13px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--sky);
      color: var(--deep-blue);
      border: 1px solid var(--hairline);
    }
    .chip.empty {
      background: transparent;
      color: var(--ink-faint);
      border-style: dashed;
    }

    /* respect reduced-motion */
    @media (prefers-reduced-motion: reduce) {
      .word { transition: none; }
      .btn-primary:active { transform: none; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="kicker">Positive Emotion Practice</div>
      <div class="date-line" id="date-line"></div>
    </header>

    <section class="card" aria-live="polite">
      <div class="card-label">Today's emotion</div>
      <div class="word" id="word">Joyful</div>
      <div class="definition" id="definition">Bright with delight, gladness, and aliveness.</div>
      <div class="prompt" id="prompt">What does Joyful make possible today?</div>
    </section>

    <details class="reflect" id="reflect">
      <summary>Add a reflection</summary>
      <textarea id="note" placeholder="Where did you feel a flicker of this? Where could you make a little more room for it?"></textarea>
      <div class="note-status" id="note-status"></div>
    </details>

    <div class="actions">
      <button class="btn-primary" id="draw" type="button">Draw today's emotion</button>
      <div class="btn-row">
        <button class="btn-secondary" id="another" type="button">Draw another</button>
        <button class="btn-secondary" id="copy" type="button">Copy</button>
      </div>
    </div>
    <div class="status" id="status">Ready</div>

    <details class="palette" id="palette-wrap">
      <summary>
        <span class="p-title">Your palette</span>
        <span class="p-count" id="p-count">0 emotions</span>
      </summary>
      <div class="chips" id="chips"></div>
    </details>
  </main>

  <script src="emotions-data.js"></script>
  <script src="data-layer.js"></script>
  <script src="app.js"></script>
</body>
</html>
